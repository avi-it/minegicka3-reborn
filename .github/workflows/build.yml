name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --console=plain
      - name: Spell tests
        run: ./gradlew runGametest --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: minegicka3-reborn-jar
          path: build/libs/*.jar
