name: Claude review

# Claude reviews every pull request. Pull requests from forks get no secrets on the
# pull_request event, so for those the maintainer comments "@claude review" on the PR.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude review') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # Always the trusted base branch; the PR is read through `gh pr diff`, never executed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You maintain Minegicka III Reborn, a clean-room Fabric reimplementation of WilliamEze's
            Minegicka III. Review this pull request for correctness bugs, crashes (client and
            dedicated server), multiplayer desyncs, and breakage of the spell tests.

            Also check that the PR adds no code, textures, sounds or models copied or decompiled from
            the original mod or from Minecraft. If it does, ask for it to be removed.

            Use inline comments for specific problems and one short top-level summary. Say clearly
            whether you recommend merging. A maintainer makes the final call.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
